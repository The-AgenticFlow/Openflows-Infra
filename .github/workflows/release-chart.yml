name: Release Helm chart

on:
  push:
    tags:
      - "chart-v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Verify tag matches Chart.yaml version
        run: |
          tag_version="${GITHUB_REF_NAME#chart-v}"
          chart_version="$(helm show chart charts/openflows \
            | awk '/^version:/ {print $2}')"
          if [ "$tag_version" != "$chart_version" ]; then
            echo "tag chart-v${tag_version} != Chart.yaml ${chart_version}" >&2
            exit 1
          fi

      - name: Lint chart
        run: helm lint charts/openflows

      - name: Package chart
        run: helm package charts/openflows -d .

      - name: Push to GHCR
        env:
          HELM_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$HELM_REGISTRY_TOKEN" | helm registry login ghcr.io \
            -u "${{ github.actor }}" --password-stdin
          helm push openflows-*.tgz oci://ghcr.io/the-agenticflow/charts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: openflows-*.tgz
          generate_release_notes: true
