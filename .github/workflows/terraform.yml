name: Terraform

# Pull requests: checks and a plan per environment. main: apply staging.
# v* tags: apply production. Nightly: plan both to catch drift.
on:
  pull_request:
    paths: ["terraform/**", ".github/workflows/terraform.yml"]
  push:
    branches: [main]
    paths: ["terraform/**", ".github/workflows/terraform.yml"]
    tags: ["v*"]
  schedule:
    - cron: "0 5 * * *"

permissions: {}

env:
  TF_VERSION: "1.15.8"
  TRIVY_VERSION: "0.76.1"
  TF_IN_AUTOMATION: "1"
  AWS_REGION: ${{ vars.AWS_REGION }}

# Jobs never set `environment:`: it changes the OIDC subject and the AWS roles
# would refuse the token. The roles' trust policies are the gate.
jobs:
  checks:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive terraform

      - name: terraform validate
        run: |
          for root in terraform/bootstrap terraform/envs/staging terraform/envs/production; do
            terraform -chdir="$root" init -backend=false -input=false >/dev/null
            terraform -chdir="$root" validate
          done

      - name: trivy (checksum-verified release)
        run: |
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          curl -sSfL -o trivy.tgz "${base}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSfL -o sums.txt "${base}/trivy_${TRIVY_VERSION}_checksums.txt"
          grep " trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz$" sums.txt | sed "s/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz/trivy.tgz/" | sha256sum -c -
          tar xzf trivy.tgz trivy
          ./trivy config --exit-code 1 --severity HIGH,CRITICAL terraform/

      # The staging plan role trusts pull requests and main, not tags.
      - name: AWS credentials for the IAM cases
        if: github.ref_type != 'tag'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_STAGING_PLAN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: checks-${{ github.run_id }}

      - name: IAM cases against the live staging apply role
        if: github.ref_type != 'tag'
        working-directory: terraform/bootstrap
        run: >-
          python3 tests/iam_policy_tests.py tests/staging-apply-cases.json
          --principal "arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/openflows/openflows-staging-terraform-apply"

  plan:
    if: github.event_name == 'pull_request' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        environment: [staging, production]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ matrix.environment == 'staging' && vars.AWS_ROLE_STAGING_PLAN || vars.AWS_ROLE_PRODUCTION_PLAN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: plan-${{ matrix.environment }}-${{ github.run_id }}

      - name: terraform plan
        id: plan
        working-directory: terraform/envs/${{ matrix.environment }}
        env:
          STATE_BUCKET: ${{ matrix.environment == 'staging' && vars.TF_STATE_BUCKET_STAGING || vars.TF_STATE_BUCKET_PRODUCTION }}
          ZONE_NAME: ${{ matrix.environment == 'staging' && vars.ZONE_NAME_STAGING || vars.ZONE_NAME_PRODUCTION }}
        run: |
          terraform init -input=false -backend-config="bucket=${STATE_BUCKET}"
          set +e
          terraform plan -input=false -lock-timeout=5m -detailed-exitcode -out=tfplan -var "zone_name=${ZONE_NAME}" >/dev/null
          code=$?
          set -e
          [ "$code" -eq 1 ] && exit 1
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          # Summary only: resource headers and totals, never attribute values.
          terraform show -no-color tfplan | grep -E '^\s+# .* (will|must) be|^Plan:|^No changes' | sed 's/^ *//' > summary.txt || true
          cat summary.txt

      - name: Comment the plan summary
        if: github.event_name == 'pull_request'
        working-directory: terraform/envs/${{ matrix.environment }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          ENVIRONMENT: ${{ matrix.environment }}
        run: |
          marker="<!-- terraform-plan-${ENVIRONMENT} -->"
          body="$(printf '%s\n### Terraform plan: `%s`\n\n```\n%s\n```\n' "$marker" "$ENVIRONMENT" "$(cat summary.txt)")"
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate --jq ".[] | select(.body | startswith(\"${marker}\")) | .id" | head -1)"
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" -f body="$body" >/dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -f body="$body" >/dev/null
          fi

      - name: Fail the nightly run on drift
        if: github.event_name == 'schedule' && steps.plan.outputs.exitcode == '2'
        run: |
          echo "::error::${{ matrix.environment }} has drifted from main; see the plan summary above."
          exit 1

  apply:
    if: github.event_name == 'push'
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: terraform-apply-${{ github.ref_type == 'tag' && 'production' || 'staging' }}
      cancel-in-progress: false
    env:
      ENVIRONMENT: ${{ github.ref_type == 'tag' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ github.ref_type == 'tag' && vars.AWS_ROLE_PRODUCTION_APPLY || vars.AWS_ROLE_STAGING_APPLY }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: apply-${{ github.run_id }}

      - name: terraform plan
        working-directory: terraform/envs/${{ env.ENVIRONMENT }}
        env:
          STATE_BUCKET: ${{ github.ref_type == 'tag' && vars.TF_STATE_BUCKET_PRODUCTION || vars.TF_STATE_BUCKET_STAGING }}
          ZONE_NAME: ${{ github.ref_type == 'tag' && vars.ZONE_NAME_PRODUCTION || vars.ZONE_NAME_STAGING }}
        run: |
          terraform init -input=false -backend-config="bucket=${STATE_BUCKET}"
          terraform plan -input=false -lock-timeout=5m -out=tfplan -var "zone_name=${ZONE_NAME}" >/dev/null
          terraform show -no-color tfplan | grep -E '^\s+# .* (will|must) be|^Plan:|^No changes' | sed 's/^ *//' || true

      # Deletes and replacements need a deliberate, reviewed change, never a surprise.
      - name: Refuse destroys and replacements
        working-directory: terraform/envs/${{ env.ENVIRONMENT }}
        run: |
          destroys="$(terraform show -json tfplan | jq -r '[.resource_changes[] | select(.change.actions | index("delete")) | .address] | join(", ")')"
          if [ -n "$destroys" ]; then
            echo "::error::Plan deletes or replaces: ${destroys}"
            exit 1
          fi

      - name: terraform apply
        working-directory: terraform/envs/${{ env.ENVIRONMENT }}
        run: terraform apply -input=false -lock-timeout=5m tfplan
