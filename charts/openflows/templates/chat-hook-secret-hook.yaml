{{- /*
Pre-install/pre-upgrade hook: generate the chat hook secret once and persist it
in a dedicated Secret. The configmap template references this Secret via
`lookup`, which works because hooks run before the main release resources.
Without this, `lookup` in the configmap returns empty on first install and on
any upgrade that changes the configmap template (helm renders all templates in
one pass, so the configmap can't look up itself).
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openflows.fullname" . }}-chat-hook-secret
  labels:
    {{- include "openflows.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  # Generated once, then reused. A bare randAlphaNum regenerates on every
  # upgrade, which silently breaks the chat hook signature: Coder signs each
  # request with the secret, and a rotated secret invalidates every in-flight
  # hook. `lookup` reuses the live value on upgrade, so the pin stays optional.
  secret: {{ .Values.secrets.coderChatHookSecret | default (lookup "v1" "Secret" .Release.Namespace (printf "%s-chat-hook-secret" (include "openflows.fullname" .)) | dig "data" "secret" "" | b64dec) | default (randAlphaNum 32) | quote }}
