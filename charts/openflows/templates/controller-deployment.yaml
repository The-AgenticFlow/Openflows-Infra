{{- if .Values.controller.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openflows.fullname" . }}-controller
  labels:
    {{- include "openflows.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  replicas: {{ .Values.controller.replicas }}
  selector:
    matchLabels:
      {{- include "openflows.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        {{- include "openflows.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: controller
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: controller
          image: "{{ .Values.controller.image }}:{{ .Values.controller.tag }}"
          args: ["run"]
          ports:
            - name: hooks
              containerPort: 3001
          env:
            - name: CODER_URL
              value: {{ .Values.coder.accessUrl | quote }}
            - name: REDIS_URL
              value: "redis://{{ include "openflows.fullname" . }}-redis:6379"
            - name: OPENFLOWS_TENANT
              value: {{ .Values.controller.tenant | quote }}
            - name: OPENFLOWS_HOOK_ADDR
              value: {{ .Values.controller.hookAddr | quote }}
            - name: OPENFLOWS_HOOK_HOST
              value: {{ default (printf "%s-controller" (include "openflows.fullname" .)) .Values.controller.hookHost | quote }}
            - name: A2A_RELAY_ADDR
              value: {{ .Values.controller.a2aRelayAddr | quote }}
            - name: CODER_EXTERNAL_AUTH_0_ID
              value: {{ .Values.coder.externalAuth.id | quote }}
            - name: CODER_SESSION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "openflows.secretName" . }}
                  key: coderSessionToken
            - name: CODER_CHAT_HOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "openflows.fullname" . }}-chat-hook-secret
                  key: secret
            {{- if .Values.secrets.slackWebhookUrl }}
            - name: SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "openflows.secretName" . }}
                  key: slackWebhookUrl
            {{- end }}
            {{- if .Values.secrets.discordWebhookUrl }}
            - name: DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "openflows.secretName" . }}
                  key: discordWebhookUrl
            {{- end }}
          {{- with .Values.controller.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
