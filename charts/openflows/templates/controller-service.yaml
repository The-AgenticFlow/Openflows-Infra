{{- if .Values.controller.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "openflows.fullname" . }}-controller
  labels:
    {{- include "openflows.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  type: {{ .Values.controller.service.type }}
  selector:
    {{- include "openflows.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: controller
  ports:
    - name: hooks
      port: {{ .Values.controller.service.port }}
      targetPort: hooks
{{- end }}
