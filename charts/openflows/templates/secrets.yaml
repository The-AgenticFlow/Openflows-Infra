{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openflows.fullname" . }}
  labels:
    {{- include "openflows.labels" . | nindent 4 }}
type: Opaque
stringData:
  coderSessionToken: {{ .Values.secrets.coderSessionToken | quote }}
  coderAdminPassword: {{ .Values.secrets.coderAdminPassword | quote }}
  githubClientId: {{ .Values.secrets.githubClientId | quote }}
  githubClientSecret: {{ .Values.secrets.githubClientSecret | quote }}
  {{- if .Values.secrets.aiGatewayOpenaiKey }}
  aiGatewayOpenaiKey: {{ .Values.secrets.aiGatewayOpenaiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.slackWebhookUrl }}
  slackWebhookUrl: {{ .Values.secrets.slackWebhookUrl | quote }}
  {{- end }}
  {{- if .Values.secrets.discordWebhookUrl }}
  discordWebhookUrl: {{ .Values.secrets.discordWebhookUrl | quote }}
  {{- end }}
  {{- if .Values.secrets.whatsappAccountSid }}
  whatsappAccountSid: {{ .Values.secrets.whatsappAccountSid | quote }}
  {{- end }}
  {{- if .Values.secrets.whatsappApiKey }}
  whatsappApiKey: {{ .Values.secrets.whatsappApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.whatsappAuthToken }}
  whatsappAuthToken: {{ .Values.secrets.whatsappAuthToken | quote }}
  {{- end }}
  {{- if .Values.secrets.whatsappFromPhone }}
  whatsappFromPhone: {{ .Values.secrets.whatsappFromPhone | quote }}
  {{- end }}
  {{- if .Values.secrets.whatsappToPhone }}
  whatsappToPhone: {{ .Values.secrets.whatsappToPhone | quote }}
  {{- end }}
{{- end }}
---
{{- if not .Values.postgres.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openflows.fullname" . }}-postgres
  labels:
    {{- include "openflows.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Generated once, then reused. A bare randAlphaNum regenerates on every
  # upgrade, which silently breaks auth against the already-initialised data
  # dir: the pod reads the new password, Postgres still expects the old one.
  # `lookup` reuses the live value on upgrade, so the pin stays optional.
  password: {{ .Values.postgres.password | default (lookup "v1" "Secret" .Release.Namespace (printf "%s-postgres" (include "openflows.fullname" .)) | dig "data" "password" "" | b64dec) | default (randAlphaNum 24) | quote }}
{{- end }}
