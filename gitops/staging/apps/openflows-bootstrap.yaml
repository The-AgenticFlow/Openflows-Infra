# Pushes the OpenFlows workspace templates into Coder (openflows bootstrap) from
# inside the cluster. Runs as a PostSync hook: on every sync of this app, or by
# hand with the Sync button. Bootstrap is idempotent.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openflows-bootstrap
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/The-AgenticFlow/Openflows-Infra
    targetRevision: main
    path: gitops/staging/openflows-bootstrap
  destination:
    server: https://kubernetes.default.svc
    namespace: openflows
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
