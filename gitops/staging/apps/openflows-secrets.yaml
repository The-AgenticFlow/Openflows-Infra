# The secret store and the ExternalSecrets the OpenFlows chart reads. Retries cover
# the first sync, before the External Secrets CRDs exist.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openflows-secrets
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/The-AgenticFlow/Openflows-Infra
    targetRevision: main
    path: gitops/staging/openflows-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: openflows
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
