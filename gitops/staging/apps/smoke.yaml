# Smoke test for the ingress path: ALB, ACM certificate, ExternalDNS record.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: smoke
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/The-AgenticFlow/Openflows-Infra
    targetRevision: main
    path: gitops/staging/smoke
  destination:
    server: https://kubernetes.default.svc
    namespace: smoke
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
