# Separate from the openflows ExternalSecret, so a missing token never blocks
# Coder's own secrets.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openflows-bootstrap
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: aws-secrets-manager }
  target: { name: openflows-bootstrap }
  data:
    - secretKey: coderSessionToken
      remoteRef: { key: openflows/staging/provided, property: coderSessionToken }
---
# With a valid CODER_SESSION_TOKEN, bootstrap skips admin creation and only pushes
# templates; the token is required, so it never falls back to a default admin password.
apiVersion: batch/v1
kind: Job
metadata:
  name: openflows-bootstrap
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 1800
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: bootstrap
          # openflows-workspace 1.3.3: the openflows binary with the templates embedded.
          image: ghcr.io/onelrian/openflows-workspace@sha256:268d66da2e38ebee4c41e5bcd7a4decd2e8e65260671feaabfb9becb3e460f22
          env:
            - name: CODER_URL
              value: https://coder.trial.openflows.dev
            - name: CODER_SESSION_TOKEN
              valueFrom:
                secretKeyRef: { name: openflows-bootstrap, key: coderSessionToken }
            - name: HOME
              value: /tmp/home
          command: ["bash", "-ec"]
          # The coder CLI comes from the Coder server itself, so its version always matches.
          args:
            - |
              mkdir -p /tmp/bin "$HOME"
              curl -fsSL "$CODER_URL/bin/coder-linux-amd64" -o /tmp/bin/coder
              chmod +x /tmp/bin/coder
              export PATH=/tmp/bin:$PATH
              coder version
              openflows bootstrap
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          # Everything it writes (CLI, HOME, template archives) goes under /tmp.
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
