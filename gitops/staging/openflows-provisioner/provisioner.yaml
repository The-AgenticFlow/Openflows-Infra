# Stopgap: one Coder provisioner for the staging test organization. The Manager waits for a
# daemon authenticated with this organization's key; Coder's built-in provisioners only serve
# the default organization. Per-tenant, isolated provisioners come with the AWS provisioner backend.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openflows-provisioner-key
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: aws-secrets-manager }
  target: { name: openflows-provisioner-key }
  data:
    - secretKey: key
      remoteRef: { key: openflows/staging/provided, property: provisionerKey }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openflows-provisioner-app-test-org
  labels:
    app.kubernetes.io/name: openflows-provisioner
    app.kubernetes.io/instance: app-test-org
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openflows-provisioner
      app.kubernetes.io/instance: app-test-org
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openflows-provisioner
        app.kubernetes.io/instance: app-test-org
    spec:
      # Same namespaced Role as Coder: it may create workspace pods in this namespace only.
      serviceAccountName: openflows-coder
      containers:
        - name: provisioner
          # Keep in step with the Coder server tag in charts/openflows/values.yaml.
          image: ghcr.io/coder/coder:v2.37.1
          # The image entrypoint already runs the server, so name the binary and the subcommand.
          command: ["/opt/coder", "provisioner", "start"]
          args: ["--name", "app-test-org"]
          env:
            - name: CODER_URL
              value: http://openflows-coder:7080
            - name: CODER_PROVISIONER_DAEMON_KEY
              valueFrom:
                secretKeyRef: { name: openflows-provisioner-key, key: key }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
