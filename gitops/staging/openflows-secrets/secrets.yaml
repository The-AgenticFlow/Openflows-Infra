# No auth block: the controller's own Pod Identity credentials are used.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-west-1
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openflows-postgres
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: aws-secrets-manager }
  target: { name: openflows-postgres }
  data:
    - secretKey: password
      remoteRef: { key: openflows/staging/generated, property: postgresPassword }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openflows-chat-hook
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: aws-secrets-manager }
  target: { name: openflows-chat-hook }
  data:
    - secretKey: secret
      remoteRef: { key: openflows/staging/generated, property: chatHookSecret }
---
# Values a person sets in openflows/staging/provided (docs/RUNBOOK-aws.md).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openflows
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: aws-secrets-manager }
  target: { name: openflows }
  data:
    - secretKey: githubClientSecret
      remoteRef: { key: openflows/staging/provided, property: githubClientSecret }
    # The AI gateway key is entered in Coder's UI for now, not stored here.
---
# Argo CD's GitHub sign-in secret. Argo CD only resolves $argocd-github:clientSecret
# from Secrets labelled part-of: argocd.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-github
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: aws-secrets-manager }
  target:
    name: argocd-github
    template:
      metadata:
        labels: { app.kubernetes.io/part-of: argocd }
  data:
    - secretKey: clientSecret
      remoteRef: { key: openflows/staging/provided, property: argocdGithubClientSecret }
---
# The Manager's database password and the connection URL built from it. The generated password
# has no URL special characters, so it needs no escaping.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openflows-manager
  namespace: openflows
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: aws-secrets-manager }
  target:
    name: openflows-manager
    template:
      data:
        password: "{{ .password }}"
        databaseUrl: "postgres://openflows_manager:{{ .password }}@openflows-postgres:5432/openflows_control_plane?sslmode=disable"
  data:
    - secretKey: password
      remoteRef: { key: openflows/staging/manager-db, property: password }
