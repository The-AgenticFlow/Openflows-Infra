# No auth block: the controller's own Pod Identity credentials are used.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-west-1
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openflows-postgres
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: aws-secrets-manager }
  target: { name: openflows-postgres }
  data:
    - secretKey: password
      remoteRef: { key: openflows/staging/generated, property: postgresPassword }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openflows-chat-hook
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: aws-secrets-manager }
  target: { name: openflows-chat-hook }
  data:
    - secretKey: secret
      remoteRef: { key: openflows/staging/generated, property: chatHookSecret }
---
# Values a person sets in openflows/staging/provided (docs/RUNBOOK-aws.md).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openflows
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: aws-secrets-manager }
  target: { name: openflows }
  data:
    - secretKey: githubClientSecret
      remoteRef: { key: openflows/staging/provided, property: githubClientSecret }
    - secretKey: aiGatewayOpenaiKey
      remoteRef: { key: openflows/staging/provided, property: aiGatewayOpenaiKey }
