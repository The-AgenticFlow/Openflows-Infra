apiVersion: apps/v1
kind: Deployment
metadata:
  name: smoke
spec:
  replicas: 1
  selector:
    matchLabels: { app: smoke }
  template:
    metadata:
      labels: { app: smoke }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: nginx
          # nginx-unprivileged 1.30-alpine
          image: nginxinc/nginx-unprivileged@sha256:f5116ed4606f3eb015dd4a8e28cb9b351476dc0ad4bc6e9f93b19cec130cdf03
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 32Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: smoke
spec:
  selector: { app: smoke }
  ports:
    - port: 80
      targetPort: 8080
---
# group.name puts every staging Ingress on one shared ALB (one ALB's cost, not one each).
# The controller picks the ACM certificate matching the TLS host; ExternalDNS adds the record.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: smoke
  annotations:
    alb.ingress.kubernetes.io/group.name: openflows-staging
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
spec:
  ingressClassName: alb
  tls:
    - hosts: [smoke.trial.openflows.dev]
  rules:
    - host: smoke.trial.openflows.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: smoke
                port:
                  number: 80
